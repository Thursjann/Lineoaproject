<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ระบบจัดการร้านซักรีด Fitcheck Laundry</title>
  <!-- Google Fonts - Outfit, Inter & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- AOS Animation Library -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  
  <style>
    :root {
      --font-heading: 'Outfit', 'Prompt', sans-serif;
      --font-body: 'Inter', 'Prompt', sans-serif;

      /* User Specified Palette */
      --primary: #83695B;          /* Warm Cocoa Brown */
      --primary-hover: #6D564A;    /* Darker Cocoa */
      --secondary: #ECC7D2;        /* Soft Dusty Pink */
      --accent-blue: #C9DEE5;      /* Gentle Powder Blue */
      --accent-olive: #B8B87F;     /* Muted Olive Matcha */

      --success: #2ECC71;
      --info: #3498DB;
      --warning: #F39C12;
      --danger: #E74C3C;
      --bg: #FBF8F6;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #43352E;
      --text-muted: #83695B;
      --border: #EEDFD9;
      --shadow-sm: 0 4px 14px rgba(131, 105, 91, 0.08);
      --shadow-md: 0 8px 24px rgba(131, 105, 91, 0.12);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: linear-gradient(135deg, var(--primary), #5B2C6F);
      padding: 20px 30px;
      color: #FFFFFF;
      border-radius: var(--radius);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
    }

    .header-title {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .refresh-badge {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .refresh-badge:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    /* Kanban Board Layout */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1200px) {
      .kanban-board {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 900px) {
      .kanban-board {
        grid-template-columns: repeat(2, 1fr);
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      header {
        padding: 16px 20px;
      }
      .kanban-board {
        grid-template-columns: 1fr;
      }
    }

    .kanban-column {
      background-color: #ECEFF1;
      border-radius: var(--radius);
      padding: 16px;
      max-height: calc(100vh - 220px);
      min-height: 520px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .column-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 4px;
      margin-top: 10px;
    }

    /* Custom Custom Scrollbar for Kanban Columns */
    .column-content::-webkit-scrollbar {
      width: 6px;
    }

    .column-content::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
      border-radius: 10px;
    }

    .column-content::-webkit-scrollbar-thumb {
      background: rgba(131, 105, 91, 0.3);
      border-radius: 10px;
    }

    .column-content::-webkit-scrollbar-thumb:hover {
      background: rgba(131, 105, 91, 0.6);
    }

    .column-header {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 3px solid transparent;
      margin-bottom: 4px;
    }

    .column-header.pending { border-color: var(--warning); color: #B9770E; }
    .column-header.picked_up { border-color: var(--info); color: #21618C; }
    .column-header.washing { border-color: var(--primary); color: #6C3483; }
    .column-header.completed { border-color: #17A589; color: #117A65; }
    .column-header.delivered { border-color: #2ECC71; color: #1E8449; }

    .card-count {
      background-color: rgba(0, 0, 0, 0.1);
      color: var(--text-main);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    /* Order Cards */
    .order-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .customer-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border);
    }

    .customer-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #EAECEE;
    }

    .customer-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .order-details {
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-val {
      font-weight: 500;
    }

    .location-link {
      color: #1ABC9C;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .location-link:hover {
      text-decoration: underline;
    }

    /* Buttons */
    .btn-action {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #FFFFFF;
      transition: filter 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      filter: brightness(0.9);
    }

    .btn-pending { background-color: var(--info); }
    .btn-picked_up { background-color: var(--primary); }
    .btn-washing { background-color: var(--success); }
    
    .card-footer-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }
    
    .btn-card-util {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #FFFFFF;
      transition: filter 0.2s ease;
    }
    
    .btn-card-util:hover {
      filter: brightness(0.9);
    }

    .btn-edit {
      background-color: #7F8C8D;
    }
    
    .btn-delete {
      background-color: var(--danger);
    }

    .card-footer-actions .btn-action {
      width: auto;
      display: inline-flex;
      padding: 6px 12px;
    }

    .no-orders-message {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 24px 0;
      border: 1px dashed #BDC3C7;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.5);
    }

    /* Form control */
    .form-control {
      width: 100%;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #FAFAFA;
      color: var(--text-main);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
      background-color: #FFFFFF;
    }

    /* Modal Overlay styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: modalFade 0.2s ease-out;
    }

    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 1024px) {
      body {
        padding: 18px;
      }

      header {
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
      }

      .header-actions {
        flex-wrap: wrap;
        justify-content: space-between;
      }

      .refresh-badge {
        flex: 1 1 48%;
        min-width: 140px;
      }

      .kanban-board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .kanban-column {
        min-height: auto;
      }

      .order-card {
        padding: 14px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 14px;
      }

      header {
        padding: 18px 20px;
      }

      .header-title {
        font-size: 18px;
      }

      .header-actions {
        gap: 12px;
      }

      .kanban-board {
        grid-template-columns: 1fr;
      }

      .kanban-column {
        padding: 14px;
      }

      .order-card {
        gap: 10px;
      }

      .card-head,
      .order-details,
      .detail-row,
      .btn-action,
      .btn-card-util {
        font-size: 12px;
      }

      .btn-action,
      .btn-card-util {
        width: 100%;
      }
    }

    @media (min-width: 1280px) {
      body {
        padding: 32px 40px;
      }

      .kanban-board {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .kanban-column {
        min-height: 560px;
      }

      .modal-container {
        max-width: 520px;
      }
    }
  </style>
</head>
<body>

  <!-- Dashboard Header -->
  <header data-aos="fade-down" data-aos-duration="600" style="background: linear-gradient(135deg, var(--primary), var(--primary-hover)); border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow-md); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; color: #FFFFFF;">
    <div class="header-title" style="font-family: var(--font-heading); font-size: 22px; display: flex; align-items: center; gap: 12px;">
      🧺 ระบบจัดการร้านซักรีด Fitcheck Laundry (Admin)
    </div>
    <div class="header-actions" style="display: flex; align-items: center; gap: 12px;">
      <button class="refresh-badge" onclick="fetchAndRenderOrders()">ดึงข้อมูลล่าสุด ↺</button>
      <button class="refresh-badge" style="background-color:#E74C3C;" onclick="handleLogout()">ออกจากระบบ 🚪</button>
    </div>
  </header>
  <!-- Broadcast Promotions Card -->
  <div data-aos="fade-up" data-aos-duration="600" style="background-color: var(--accent-blue); border:1.5px solid #B0CFDB; border-radius:var(--radius); padding:18px; margin-bottom:24px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:12px;">
    <h3 style="font-weight:700; font-size:16px; color:#2C3A42; font-family: var(--font-heading); display:flex; align-items:center; gap:8px; margin:0;">
      📢 บรอดแคสต์โปรโมชั่นหาลูกค้าทุกคน (LINE OA Broadcast)
    </h3>
    <div style="display:flex; gap:16px; align-items:stretch; flex-wrap:wrap;">
      <textarea id="broadcast-message" class="form-control" style="flex:1; min-height:60px; font-size:13px; border-radius: 12px;" placeholder="พิมพ์โปรโมชั่นส่งกระจายหาลูกค้าทุกคน... (เช่น 'โปรซักรีดสุดฟินเฉพาะเสาร์อาทิตย์นี้ ซักพับเพียง 8฿/ชิ้น! 🧺')"></textarea>
      <button class="btn-action" style="background-color:var(--primary); width:auto; white-space:nowrap; padding:12px 24px; border-radius: 12px; font-weight: 700;" onclick="sendBroadcastPromotion()">
        🚀 ส่งบรอดแคสต์
      </button>
    </div>
  </div>

  <!-- Kanban Columns Grid -->
  <div class="kanban-board">
    
    <!-- 1. รอรับผ้า -->
    <div class="kanban-column" data-aos="fade-up" data-aos-delay="100">
      <div class="column-header pending">
        <span>รอรับผ้า (Pending)</span>
        <span id="count-pending" class="card-count">0</span>
      </div>
      <div id="col-pending" class="column-content">
        <!-- Injected dynamic cards -->
      </div>
    </div>

    <!-- 2. รับผ้าแล้ว -->
    <div class="kanban-column" data-aos="fade-up" data-aos-delay="150">
      <div class="column-header picked_up">
        <span>รับผ้าแล้ว (Picked Up)</span>
        <span id="count-picked_up" class="card-count">0</span>
      </div>
      <div id="col-picked_up" class="column-content">
        <!-- Injected dynamic cards -->
      </div>
    </div>

    <!-- 3. กำลังซัก -->
    <div class="kanban-column" data-aos="fade-up" data-aos-delay="200">
      <div class="column-header washing">
        <span>กำลังซัก (Washing)</span>
        <span id="count-washing" class="card-count">0</span>
      </div>
      <div id="col-washing" class="column-content">
        <!-- Injected dynamic cards -->
      </div>
    </div>

    <!-- 4. เสร็จสิ้น -->
    <div class="kanban-column" data-aos="fade-up" data-aos-delay="250">
      <div class="column-header completed">
        <span>ซักเสร็จสิ้น (Completed)</span>
        <span id="count-completed" class="card-count">0</span>
      </div>
      <div id="col-completed" class="column-content">
        <!-- Injected dynamic cards -->
      </div>
    </div>

    <!-- 5. จัดส่งแล้ว -->
    <div class="kanban-column" data-aos="fade-up" data-aos-delay="300">
      <div class="column-header delivered">
        <span>จัดส่งแล้ว (Delivered)</span>
        <span id="count-delivered" class="card-count">0</span>
      </div>
      <div id="col-delivered" class="column-content">
        <!-- Injected dynamic cards -->
      </div>
    </div>

  </div>

  <!-- EDIT MODAL WINDOW (One-to-Many updates) -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-container">
      <h3 style="font-weight: 600; font-size: 18px; color: var(--text-main); display:flex; justify-content:space-between; align-items:center;">
        <span>แก้ไขรายละเอียดออเดอร์</span>
        <button onclick="closeEditModal()" style="background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;">&times;</button>
      </h3>
      <input type="hidden" id="edit-order-id">
      
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--text-main);">วันเวลาที่นัดเข้ารับผ้า</label>
        <input type="datetime-local" id="edit-delivery-time" class="form-control" required>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--text-main);">รายการบริการที่ซักรีด</label>
        <div id="edit-services-container" style="display:flex; flex-direction:column; gap:10px;">
          <!-- Populated dynamically via script -->
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:12px; border-top:1px solid var(--border); padding-top:12px;">
        <button type="button" class="btn-action" style="background-color:#EAECEE; color:var(--text-main); width:auto;" onclick="closeEditModal()">ยกเลิก</button>
        <button type="button" class="btn-action" style="background-color:var(--primary); width:auto;" onclick="submitOrderEdit()">บันทึกการแก้ไข</button>
      </div>
    </div>
  </div>

  <!-- AOS Animation JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof AOS !== 'undefined') {
        AOS.init({
          duration: 650,
          once: false,
          mirror: true,
          easing: 'ease-out-cubic'
        });
      }
    });
  </script>
  <script src="admin.js"></script>
</body>
</html>
